#
# DC paper: reference setup without additional data centres (vault T-40, DEC-18).
# Best-guess choices, each mirrored with Jakob afterwards and recorded in the
# vault ANNAHMEN register. Everything not set here is the PyPSA-Eur v2026.09.0
# default.
#
# Usage, from pypsa-eur/:
#   pixi run snakemake -call --configfile config/config.dc-ref.yaml

run:
  name: dc-ref

# Brownfield 2030 from today's stock, overnight: the existing fleet (in
# operation by 2025, still running in 2030) enters as fixed capacity
# (conventional) or as lower bound of the expansion (renewables, gas); new
# capacity at 2030 costs. Myopic electricity-only was tried first, but in
# v2026.09.0 add_existing_baseyear builds the conventional fleet as sector
# links without fuel buses and needs heat inputs (memo gate 3, deviation).
foresight: overnight
planning_horizons:
- 2030

# Electricity-only (memo gate 2). The v2026.09.0 default is sector-coupled.
sector:
  enabled: false

# Weather year 2013: PyPSA-Eur default and the year most PyPSA studies use;
# a second weather year comes as robustness (T-26).
snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

clustering:
  cluster_network:
    # About 30 nodes in Germany (as PyPSA-DE), the rest of Europe coarser.
    n_clusters: 75
  focus_weights:
    DE: 0.4
  temporal:
    # Uniform 3-hourly averaging, as in the PyPSA-group studies (T-32).
    averaging: 3h
  # Plant-specific efficiencies instead of one value per carrier (as in
  # config/examples/config.validation.yaml).
  consider_efficiency_classes: true

electricity:
  estimate_renewable_capacities:
    enable: true
    from_powerplantmatching: true
    # Top up to the IRENASTAT 2024 country totals; powerplantmatching alone
    # gives about 49 GW PV in DE instead of about 90 GW (memo T-39A).
    from_irenastat: true
    year: 2024
  # Existing large batteries from powerplantmatching (home storage is not in
  # the data; batteries stay extendable).
  estimate_battery_capacities: true
  # Existing plants in operation in 2025 that are still running in 2030
  # (ANNAHMEN B4: DateOut >= 2030).
  powerplants_filter: "(DateOut >= 2030 or DateOut != DateOut) and (DateIn < 2026 or DateIn != DateIn)"

# CO2 as EU ETS price, no cap: 85 EUR/t, the EUA settlement of 2026-10-20 in
# the Instrat series the workflow downloads. The absolute 297 Mt cap of
# ANNAHMEN B2 gave a shadow price of only 17 EUR/t in the first run, so coal ran
# ahead of gas (T-40, deviation from B2).
co2_budget:
  relative: false
  upper:
    2030:

costs:
  emission_prices:
    enable: true
    co2: 85.0

load:
  # Load profile and level of 2024 (latest full year in the ENTSO-E data),
  # mapped onto the 2013 weather-year snapshots; contains today's data centres.
  fixed_year: 2024

# Bias correction of the weather-to-power conversion, calibrated on the 2024
# backcast (T-41): factor = (actual / modelled generation) / (mean / year-end
# capacity), actual from AGEB 2024 (offshore incl. curtailed energy).
renewable:
  onwind:
    correction_factor: 0.84
  offwind-ac:
    correction_factor: 0.67
  offwind-dc:
    correction_factor: 0.67
  offwind-float:
    correction_factor: 0.67
  solar:
    correction_factor: 0.89
  solar-hsat:
    correction_factor: 0.89

conventional:
  # Biomass availability as in the validation config; reproduces 2024 biomass
  # output within 1 % in the backcast (T-41).
  biomass:
    p_max_pu: 0.65

transmission_projects:
  # Planned HVDC links enter with their project capacity once built
  # (build year enforced by dc_paper: grid below).
  new_link_capacity: keep

dc_paper:
  grid:
    # Projects with build_year after the horizon are inactive (PyPSA-DE rule).
    enable: true
    # Drop planned projects built after 2030 before clustering (otherwise
    # clustering merges them into existing corridors).
    max_project_build_year: 2030
    # No endogenous grid expansion in the reference; expansion is a sensitivity.
    freeze_expansion: true
  demand:
    # Electrification of DE up to 2030 on top of the 2024 load (heat pumps,
    # EVs, electrolysis). 1.22 x 464 TWh = 566 TWh net, about 610 TWh gross:
    # lower end of the 600-700 TWh corridor of the 2025 monitoring report
    # (ANNAHMEN F13; 1.12 of row B7 gave about 570 TWh gross, below it).
    # PLACEHOLDER until the load is split by sector (gate 2).
    country: DE
    scaling_factor: 1.22
  fleet:
    # Coal exit path (KVBG): about 8 GW hard coal and 9 GW lignite at the end
    # of 2030; the powerplantmatching DateOut values leave 31 GW in DE.
    country: DE
    capacity_gw:
      coal: 8.0
      lignite: 9.0
    # No new single-axis tracking PV in DE (German PV is mostly fixed rooftop
    # and ground-mounted; the model picked 50 TWh of it in run v3). No lignite
    # must-run in 2030, as in PyPSA-DE (must-run only in its base year 2025).
    no_new_build:
    - solar-hsat
  res_floors:
    # Policy targets as minimum installed capacity in DE (ANNAHMEN A5, B3).
    enable: true
    country: DE
    targets_gw:
      solar: 215
      onwind: 115
      offwind: 14

solving:
  options:
    custom_extra_functionality: ../scripts/dc_paper/custom_extra_functionality.py
  solver:
    name: gurobi
    options: gurobi-default
  solver_options:
    gurobi-default:
      # Shared server (EWISTS01): leave headroom for other users.
      threads: 16
